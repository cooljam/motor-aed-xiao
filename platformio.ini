; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port/url, extra scripts
;   Default: board is seeed_xiao_nrf52840
;
; Documentation: http://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino

; Enable softdevice S140 for BLE (defined by the board's build config)
; board_build.softdevice = s140

; Build flags
build_flags =
	-D F_CPU=64000000L
	-D SERIAL_BUFFER_SIZE=256   ; 扩大 Wire/Serial 的 RingBuffer, 支持一次性读 240B FIFO
	-I src
	; TinyUSB 库的 src/ 目录: 让 LDF 能按 library.properties 的
	; includes=Adafruit_TinyUSB.h 匹配到该库 (提供 Serial)
	-I C:/Users/jam19/.platformio/packages/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino/src

; Optimize for size
build_type = release
; build_type = debug

; Monitor settings
monitor_speed = 115200
monitor_filters =
	default

; Libraries
; 板载 IMU 是 LSM6DS3TR-C，固件直接寄存器操作，无需第三方传感器库
; BLE 用的是 Adafruit nRF52 核心自带的 Bluefruit52Lib (SoftDevice S140)
; 不要用 sandeepmistry/BLEPeripheral (那是 nRF8001 老平台的库)
lib_deps =

; LDF chain+ : 让依赖扫描也遍历框架文件 (Arduino.h)
; 否则固件没 #include <Wire.h> 时, 提供 Serial 的 TinyUSB 库不会被链接
lib_ldf_mode = chain+

